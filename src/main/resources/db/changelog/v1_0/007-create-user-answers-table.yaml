databaseChangeLog:
  - changeSet:
      id: 007-create-user-answers-table-2026-10-21
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: user_answers
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: attempt_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_answers_attempt
                    references: exam_attempts(id)

              - column:
                  name: question_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_answers_question
                    references: questions(id)

              - column:
                  name: selected_option_id
                  type: VARCHAR(36)
                  constraints:
                    foreignKeyName: fk_user_answers_option
                    references: options(id)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false